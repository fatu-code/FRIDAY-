<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fatu's Health Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#004D1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fatu">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#004D1E; --go:#009C41; --mint:#C7EFD6; --wash:#EFF9F3;
    --paper:#F5FAF7; --line:#E1EDE6; --muted:#61806D; --rest:#8FA79A;
    --bronze:#A9793F; --silver:#7E8E86; --gold:#B8892B;
    --shadow:0 1px 2px rgba(0,77,30,.04), 0 6px 20px rgba(0,77,30,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top)}
  h1,h2,h3{font-family:'Varela Round',Nunito,sans-serif;font-weight:400;margin:0}
  button{font-family:Nunito,sans-serif;font-weight:800;border:0;cursor:pointer;transition:all .16s ease}
  button:focus-visible,input:focus-visible{outline:3px solid var(--go);outline-offset:2px}
  input{font-family:Nunito,sans-serif;font-weight:800;color:var(--ink);background:var(--paper);
    border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;outline:none;width:100%;font-size:16px}
  input:focus{border-color:var(--go);background:#fff;box-shadow:0 0 0 4px var(--wash)}
  .app{max-width:620px;margin:0 auto;padding:18px 16px 116px}

  .topbar{position:sticky;top:0;z-index:25;background:#fff;border-bottom:1.5px solid var(--line)}
  .tinner{max-width:620px;margin:0 auto;padding:17px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .greet{font-family:Nunito,sans-serif;font-weight:800;font-size:17px;color:var(--ink);letter-spacing:-.01em}
  .greet.brand{font-family:'Varela Round',sans-serif;font-weight:400;color:var(--go);font-size:18px}
  .tdate{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sc{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px;position:relative;box-shadow:var(--shadow)}
  .sc .ico{width:44px;height:44px;border-radius:14px;background:var(--wash);display:flex;align-items:center;justify-content:center}
  .sc .ico svg{width:21px;height:21px;stroke:var(--go);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sc .chip{position:absolute;top:17px;right:16px;background:var(--wash);color:var(--go);
    border-radius:99px;padding:5px 10px;font-size:10px;font-weight:900;letter-spacing:.04em}
  .sc b{display:block;font-family:'Varela Round',sans-serif;font-size:30px;line-height:1;margin-top:16px}
  .sc b.sm{font-size:21px;margin-top:20px}
  .sc span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:5px}
  .statusbox{background:var(--wash);border-radius:16px;padding:16px;margin-top:12px}
  .statusbox .dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--go);margin-right:8px;vertical-align:middle}
  .statusbox b{font-size:15px;font-weight:800}
  .statusbox span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:5px}
  .tagchip{display:inline-block;background:var(--wash);color:var(--go);border-radius:99px;
    padding:7px 14px;font-size:12px;font-weight:900;letter-spacing:.03em}
  .stat{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .stat b{display:block;font-family:'Varela Round',sans-serif;font-size:27px;line-height:1}
  .stat b.sm{font-size:20px}
  .stat span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:6px}
  .stat.accent b{color:var(--go)}
  .mini-mission{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--paper)}
  .mini-mission:last-of-type{border-bottom:0}
  .mini-mission .mm{flex:1;min-width:0}
  .mini-mission .mm b{display:block;font-size:14px;font-weight:800}
  .mini-mission .mm .tbar{margin-top:7px}
  .mini-mission .cnt{font-size:12px;font-weight:900;color:var(--muted);white-space:nowrap}
  .mini-mission.done .cnt{color:var(--go)}
  .bpill{display:inline-block;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;
    padding:7px 13px;font-size:12px;font-weight:800;margin:0 6px 6px 0}
  .bpill.t1{border-color:var(--bronze)} .bpill.t2{border-color:var(--silver)} .bpill.t3{border-color:var(--gold)}
  .linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
  .linkbtn{background:none;color:var(--go);font-size:13px;padding:4px 0;letter-spacing:.04em}
  .lad{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--paper)}
  .lad:last-of-type{border-bottom:0}
  .lad .num{width:38px;height:38px;flex-shrink:0;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:'Varela Round',sans-serif;font-size:15px;color:var(--muted)}
  .lad .txt{flex:1;min-width:0}
  .lad .txt b{display:block;font-size:15px;font-weight:800;color:var(--muted)}
  .lad .txt span{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em}
  .lad .st{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--line);white-space:nowrap}
  .lad.reached .num{background:var(--wash);border-color:var(--go);color:var(--ink)}
  .lad.reached .txt b{color:var(--ink)}
  .lad.reached .st{color:var(--go)}
  .lad.here{background:linear-gradient(90deg,var(--wash),transparent);border-radius:14px;padding-left:10px;margin-left:-10px}
  .lad.here .num{background:var(--ink);border-color:var(--ink);color:#fff}
  .lad.here .st{color:var(--ink)}
  .ptab{width:100%;border-collapse:collapse;font-size:13px;font-weight:700;margin-top:4px}
  .ptab td{padding:11px 0;border-bottom:1px solid var(--paper);color:var(--muted)}
  .ptab td:last-child{text-align:right;font-family:'Varela Round',sans-serif;font-weight:400;font-size:16px;color:var(--ink);white-space:nowrap}
  .ptab tr:last-child td{border-bottom:0}

  .phead{margin:4px 4px 16px}
  .phead h1{font-size:26px;line-height:1.15}
  .phead p{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 0;line-height:1.5}
  .editflag{display:inline-flex;align-items:center;gap:8px;background:#FBF4E6;color:var(--gold);
    border:1.5px solid #F0DFB8;border-radius:99px;padding:8px 14px;font-size:12px;font-weight:900;margin-top:12px}
  .editflag button{background:var(--gold);color:#fff;border-radius:99px;padding:4px 11px;font-size:11px;font-weight:900}
  .dcard{background:linear-gradient(150deg,#025B25 0%,var(--ink) 100%);border-radius:22px;
    padding:20px;margin-bottom:16px;color:#fff;box-shadow:0 10px 28px rgba(0,77,30,.22);position:relative;overflow:hidden}
  .dcard:before{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    border-radius:99px;background:rgba(255,255,255,.05)}
  .dcard .drow{display:flex;align-items:center;gap:12px;position:relative}
  .dcard .darr{width:38px;height:38px;flex-shrink:0;border-radius:99px;border:1.5px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.06);color:#fff;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
  .dcard .darr:hover:not(:disabled){background:rgba(255,255,255,.16)}
  .dcard .darr:disabled{opacity:.3;cursor:default}
  .dcard .dmid{flex:1;min-width:0;text-align:center;cursor:pointer}
  .dcard .dwhen{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);opacity:.9}
  .dcard .dbig{font-family:'Varela Round',sans-serif;font-size:23px;line-height:1.15;margin-top:4px}
  .dcard .dstat{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:rgba(255,255,255,.12);
    border-radius:99px;padding:7px 14px;font-size:12px;font-weight:800}
  .dcard .dstat .dtag{font-weight:900;letter-spacing:.04em}
  .dcard .dstat.amber{background:rgba(184,137,43,.32)}
  .dcard .dstat.grey{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
  .dcard .dhint{font-size:11px;font-weight:700;color:rgba(255,255,255,.6);margin-top:10px}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;margin-bottom:12px}
  .card h2{font-size:21px}
  .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:7px}
  .card.rest{background:linear-gradient(180deg,#fff,#F8FBF9);border-style:dashed}
  .lede{font-size:14px;font-weight:700;color:var(--muted);line-height:1.6;margin-top:8px}
  .metaline{font-size:13px;font-weight:700;color:var(--muted);margin-top:12px;line-height:1.6}
  .metaline b{color:var(--ink)}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--paper);
    border:1.5px solid var(--line);border-radius:16px;padding:6px;margin-top:14px}
  .seg button{background:none;color:var(--muted);border-radius:11px;padding:13px 6px;font-size:14px}
  .seg button:hover{background:#fff;color:var(--ink)}
  .seg button.on{background:var(--ink);color:#fff}
  .seg button.on.rest{background:var(--rest)}

  .ex{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--paper)}
  .ex:last-of-type{border-bottom:0}
  .ex .nm{flex:1;min-width:0}
  .ex .nm b{display:block;font-size:16px;font-weight:800}
  .ex .nm span{font-size:12px;font-weight:700;color:var(--muted)}
  .ex .in{width:100px;flex-shrink:0}
  .ex .in input{text-align:center;padding:11px 8px}
  .ex.done .in input{background:var(--wash);border-color:var(--go)}
  .ex .tick{width:18px;flex-shrink:0;text-align:center;font-size:16px;color:var(--line);font-weight:900}
  .ex.done .tick{color:var(--go)}

  .allbtn{width:100%;margin-top:16px;background:var(--ink);color:#fff;border-radius:14px;padding:15px;font-size:15px}
  .allbtn:hover{background:var(--go)}
  .ghost{background:#fff;border:1.5px solid var(--line);color:var(--muted);border-radius:12px;padding:11px 16px;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .ghost:hover{border-color:var(--go);color:var(--ink)}
  .ghostrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

  .bignum{display:flex;align-items:baseline;gap:8px;margin:4px 0 2px}
  .bignum b{font-family:'Varela Round',sans-serif;font-size:40px;line-height:1}
  .bignum small{font-size:13px;color:var(--muted);font-weight:800}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
  .tile b{display:block;font-family:'Varela Round',sans-serif;font-size:30px;line-height:1}
  .tile span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:7px}
  .tile.flame b{color:var(--go)}

  .setlist{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .setpill{background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:7px 13px;font-size:12px;font-weight:800}

  .rank{display:flex;align-items:center;gap:16px}
  .rank .lv{width:74px;height:74px;flex-shrink:0;border-radius:22px;background:var(--ink);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .rank .lv b{font-family:'Varela Round',sans-serif;font-size:29px;line-height:1}
  .rank .lv span{font-size:8px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;opacity:.75}
  .rank .who{flex:1;min-width:0}
  .rank .who h2{font-size:22px}
  .xpbar{height:9px;background:var(--wash);border-radius:99px;overflow:hidden;margin-top:10px}
  .xpbar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .pcts{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);margin-top:7px}

  .trow{padding:15px 0;border-bottom:1px solid var(--paper)}
  .trow:last-of-type{border-bottom:0}
  .trow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .trow .top b{font-size:15px;font-weight:800}
  .trow .top span{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
  .trow .top span em{font-style:normal;color:var(--ink);font-family:'Varela Round',sans-serif;font-size:16px}
  .tbar{height:8px;background:var(--wash);border-radius:99px;overflow:hidden;margin-top:9px;position:relative}
  .tbar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .5s ease}
  .tbar i.slow{background:var(--gold)}
  .tbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rest);border-radius:2px}

  .mission{padding:14px 0;border-bottom:1px solid var(--paper)}
  .mission:last-of-type{border-bottom:0}
  .mission .mt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .mission .mt b{font-size:15px;font-weight:800}
  .mission .mt span{font-size:12px;font-weight:900;color:var(--go);white-space:nowrap}
  .mission.done .mt b{color:var(--go)}

  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
  .badge{border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--paper);position:relative}
  .badge.got{background:#fff}
  .badge.got.t1{border-color:var(--bronze)}
  .badge.got.t2{border-color:var(--silver)}
  .badge.got.t3{border-color:var(--gold)}
  .badge b{display:block;font-size:13px;font-weight:800;color:var(--muted);padding-right:18px}
  .badge.got b{color:var(--ink)}
  .badge .sub{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.4}
  .badge .mark{position:absolute;top:12px;right:12px;font-size:14px;color:var(--line);font-weight:900}
  .badge.got.t1 .mark{color:var(--bronze)}
  .badge.got.t2 .mark{color:var(--silver)}
  .badge.got.t3 .mark{color:var(--gold)}
  .badge .mini{height:5px;background:var(--wash);border-radius:99px;margin-top:9px;overflow:hidden}
  .badge .mini i{display:block;height:100%;background:var(--rest);border-radius:99px}
  .badge .pts{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px;display:block}


  /* toast */
  .toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:60;max-width:588px;margin:0 auto;
    background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 12px 34px rgba(0,77,30,.3);
    animation:pop .35s cubic-bezier(.2,.9,.25,1)}
  .toast[hidden]{display:none}
  .toast b{display:block;font-family:'Varela Round',sans-serif;font-size:17px}
  .toast span{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:3px}
  @keyframes pop{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}

  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);
    backdrop-filter:blur(16px);border-top:1.5px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
  .bottominner{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  .nb{background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;
    color:var(--rest);font-size:10px;letter-spacing:.03em;font-weight:800;border-radius:14px}
  .nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nb.on{color:var(--ink)}
  .nb.on svg{stroke:var(--go)}
  /* day modal */
  .scrim{position:fixed;inset:0;z-index:50;background:rgba(0,40,16,.36);backdrop-filter:blur(3px);animation:fade .2s ease}
  .scrim[hidden]{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:620px;margin:0 auto;
    background:var(--paper);border-radius:26px 26px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(0,77,30,.22);animation:rise .28s cubic-bezier(.2,.85,.25,1)}
  .modal[hidden]{display:none}
  @keyframes rise{from{transform:translateY(34px)}to{transform:none}}
  .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 16px}
  .modal .mh{font-family:'Varela Round',sans-serif;font-size:22px;margin-bottom:2px}
  .modal .ms{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:16px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
    border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:8px;color:var(--ink);font-size:16px;font-weight:800}
  .opt:hover{border-color:var(--go)}
  .opt .radio{width:22px;height:22px;flex-shrink:0;border-radius:99px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;transition:border-color .16s}
  .opt .radio i{width:11px;height:11px;border-radius:99px;background:var(--go);transform:scale(0);transition:transform .18s cubic-bezier(.2,.9,.3,1.4)}
  .opt.on{border-color:var(--go);background:var(--wash)}
  .opt.on .radio{border-color:var(--go)}
  .opt.on .radio i{transform:scale(1)}
  .opt .sub{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:3px}
  .opt .lbl{flex:1;min-width:0}
  .modal .cancel{width:100%;background:none;color:var(--muted);padding:15px;font-size:14px;
    letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
  /* fast hero */
  .fasthero{display:flex;align-items:center;gap:18px;margin-top:16px}
  .fh-num{font-family:'Varela Round',sans-serif;font-size:52px;line-height:1;color:var(--muted)}
  .fh-num em{font-style:normal;font-size:16px;font-weight:800;margin-left:6px;color:var(--muted)}
  .fh-num.k1,.fh-num.k2{color:var(--go)} .fh-num.k3{color:var(--gold)}
  .fh-lab b{display:block;font-size:17px;font-weight:800}
  .fh-lab span{font-size:13px;font-weight:700;color:var(--muted)}
  .fastbar{position:relative;height:14px;background:var(--wash);border-radius:99px;margin-top:18px}
  .fastfill{height:100%;border-radius:99px;background:var(--rest);transition:width .5s ease}
  .fastfill.k1,.fastfill.k2{background:var(--go)} .fastfill.k3{background:var(--gold)}
  .fastbar u{position:absolute;top:-6px;width:2px;height:26px;background:var(--line)}
  .fastbar u span{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:var(--muted);white-space:nowrap}
  .fastbar u.lit{background:var(--go)} .fastbar u.lit span{color:var(--go)}
  .fasttiers{font-size:12px;font-weight:700;color:var(--muted);margin-top:30px;text-align:center}

  /* sugar streak */
  .card.clean{border-color:var(--go)}
  .card.slipped{border-color:var(--warn)}
  .streakhero{display:flex;align-items:center;gap:18px;margin-top:6px}
  .sflame{width:96px;height:96px;flex-shrink:0;border-radius:24px;background:var(--paper);border:2px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .sflame.lit{background:linear-gradient(180deg,#FFF6E4,#fff);border-color:var(--gold)}
  .sf-n{font-family:'Varela Round',sans-serif;font-size:40px;line-height:1;color:var(--ink)}
  .sflame.lit .sf-n{color:var(--gold)}
  .sf-l{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .sf-side{flex:1}
  .sf-best{font-size:15px;font-weight:800} .sf-best b{font-family:'Varela Round',sans-serif;font-size:20px;color:var(--go)}
  .sf-tot{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
  .swins{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .swin{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);
    border:1.5px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);font-size:15px;font-weight:800}
  .swin:hover{border-color:var(--go)}
  .swin .sbox{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;transition:all .16s}
  .swin .slabel{flex:1;min-width:0}
  .swin .spts{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.04em}
  .swin.on{background:var(--wash);border-color:var(--go)}
  .swin.on .sbox{background:var(--go);border-color:var(--go)}
  .swin.on .spts{color:var(--go)}
  .swin.muted{opacity:.45}
  .sweepnote{font-size:13px;font-weight:800;color:var(--muted);margin-top:12px;text-align:center}
  .sugar2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .sugar2 button{background:#fff;border:1.5px solid var(--line);color:var(--muted);border-radius:14px;padding:14px 6px;font-size:14px}
  .sugar2 button.cheat.on{background:var(--gold);color:#fff;border-color:var(--gold)}
  .sugar2 button.slip.on{background:var(--warn);color:#fff;border-color:var(--warn)}
  .card.cheated{border-color:var(--gold)}
  .sflame.paused{background:linear-gradient(180deg,#FBF4E6,#fff);border-color:var(--gold)}
  .sflame.paused .sf-n{color:var(--gold)}
  .sliptext{font-size:13px;font-weight:700;color:var(--warn);line-height:1.6;margin-top:14px;background:#FBEEE4;border-radius:12px;padding:14px}
  .cheattext{font-size:13px;font-weight:700;color:var(--gold);line-height:1.6;margin-top:14px;background:#FBF4E6;border-radius:12px;padding:14px}
  .waterrow{display:flex;align-items:center;gap:10px;margin-top:16px}
  .glass{flex:1;aspect-ratio:3/4;border:2px solid var(--line);border-radius:6px 6px 10px 10px;
    background:var(--paper);cursor:pointer;transition:all .16s;position:relative;overflow:hidden}
  .glass.full{border-color:var(--go)}
  .glass.full:after{content:'';position:absolute;left:0;right:0;bottom:0;top:32%;background:var(--mint)}
  .glass.full:before{content:'';position:absolute;left:0;right:0;bottom:0;height:32%;background:var(--go);opacity:.35}
  .watercount{font-family:'Varela Round',sans-serif;font-size:16px;white-space:nowrap;color:var(--ink)}
  .page[hidden]{display:none}
  .chrome[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div></nav>

<script>
/* ================= storage shim: works hosted or embedded ================= */
const store={
  async get(k){
    if(window.storage&&window.storage.get){try{const r=await window.storage.get(k);return r&&r.value?r.value:null;}catch(e){return null;}}
    try{return localStorage.getItem(k);}catch(e){return null;}
  },
  async set(k,v){
    if(window.storage&&window.storage.set){try{return await window.storage.set(k,v);}catch(e){}}
    try{localStorage.setItem(k,v);}catch(e){}
  }
};

const KEY='fatu-tracker-v3';
const WEEK1_MONDAY='2026-07-20';
const DAYNAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const EX={
  jacks:{name:'Jumping jacks',unit:'reps',per:100,year:20000},
  knees:{name:'High knees',unit:'reps',per:100,year:20000},
  climbers:{name:'Mountain climbers',unit:'reps',per:60,year:12000},
  plank:{name:'Elbow plank',unit:'seconds',per:120,year:12000},
  flutter:{name:'Flutter kicks',unit:'reps',per:100,year:16000},
  twists:{name:'Russian twists',unit:'reps',per:80,year:14000},
  tucks:{name:'Leg tuck ins',unit:'reps',per:40,year:8000}
};
const DEFAULT_CFG={
  sets:{A:{name:'Juu',ex:['jacks','knees','climbers']},
        B:{name:'Chini',ex:['plank','flutter','twists','tucks']}},
  stepGoal:2000,
  restTarget:2,
  waterGoal:4,
  fastFloor:12, fastGood:14, fastFull:16, breakHour:14,
  sugarList:['No soda','No sugar in tea','No sweets or biscuits','No packaged juice or energy drinks'],
  per:Object.fromEntries(Object.entries(EX).map(([k,v])=>[k,v.per])),
  year:Object.assign({steps:400000},Object.fromEntries(Object.entries(EX).map(([k,v])=>[k,v.year])))
};

let state={cfg:JSON.parse(JSON.stringify(DEFAULT_CFG)),logs:{},plan:{},seen:[]};
let page='home', viewDay=null;

/* ================= dates ================= */
const TZ='Africa/Kampala';   // East Africa Time, UTC+3, no daylight saving
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
// today and the hour come from Kampala, whatever the phone or browser is set to
const todayStr=()=>new Intl.DateTimeFormat('en-CA',
  {timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const hourNow=()=>Number(new Intl.DateTimeFormat('en-GB',
  {timeZone:TZ,hour:'2-digit',hour12:false}).format(new Date()));
const ord=d=>(d>3&&d<21)?d+'th':d+({1:'st',2:'nd',3:'rd'}[d%10]||'th');
const parse=s=>new Date(s+'T00:00');
const longDate=s=>{const d=parse(s);return DAYNAMES[d.getDay()]+' '+ord(d.getDate())+' '+MONTHS[d.getMonth()];};
const midDate=s=>{const d=parse(s);return ord(d.getDate())+' '+MONTHS[d.getMonth()];};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const mondayOf=s=>addDays(s,-((parse(s).getDay()+6)%7));
const weekNo=s=>Math.floor((parse(mondayOf(s))-parse(WEEK1_MONDAY))/604800000)+1;
const weekDays=off=>{const m=addDays(mondayOf(todayStr()),off*7);return [...Array(7)].map((_,i)=>addDays(m,i));};
const daysOfWeekFrom=mon=>[...Array(7)].map((_,i)=>addDays(mon,i));

/* ================= data ================= */
const got=(id,d)=>Number((state.logs[d]||{})[id])||0;
const setOn=d=>state.plan[d]||null;
const exOf=d=>{const s=setOn(d);return (s&&s!=='rest')?state.cfg.sets[s].ex:[];};
const setName=d=>{const s=setOn(d);return !s?'Not set':(s==='rest'?'Rest':state.cfg.sets[s].name);};
const totalAll=id=>Object.keys(state.logs).reduce((s,d)=>s+got(id,d),0);
const sumIn=(id,a,b)=>Object.keys(state.logs).filter(d=>d>=a&&d<=b).reduce((s,d)=>s+got(id,d),0);
const allRepTotal=()=>Object.keys(EX).reduce((s,k)=>s+totalAll(k),0);
function setDone(d){
  const s=setOn(d), list=exOf(d);
  if(!s||s==='rest'||!list.length) return false;
  return list.every(k=>got(k,d)>=state.cfg.per[k]);
}
async function planDay(d,val,jump){
  if(state.plan[d]===val) delete state.plan[d]; else state.plan[d]=val;
  // picking a set from Home drops you straight into it
  if(jump && (state.plan[d]==='A'||state.plan[d]==='B')) page='core';
  await save();
  render();
  if(jump) window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= points, levels, ranks ================= */
function workXP(){
  let xp=0;
  Object.keys(state.logs).forEach(d=>{
    exOf(d).forEach(k=>{
      const v=got(k,d), t=state.cfg.per[k];
      if(v>=t*1.5) xp+=18; else if(v>=t) xp+=12; else if(v>0) xp+=5;
    });
    xp+=Math.min(24,Math.floor(got('steps',d)/500)*2);
    if(setDone(d)) xp+=15;
    if(fastKept(d)) xp+=15;
    if(!sugarOverride(d)){ xp += sugarTicks(d).length*5; if(sugarState(d)==='clean') xp+=10; }
    xp+=Math.min(state.cfg.waterGoal,water(d))*2;
  });
  Object.keys(state.plan).forEach(d=>{ if(state.plan[d]==='rest'&&d<=todayStr()) xp+=4; });
  return xp;
}
const TIER_PTS={1:50,2:120,3:250};
function badgeState(){
  return BADGES.map(b=>{
    const p=b.f();
    return {...b,have:Math.min(p.have,p.need),need:p.need,got:p.have>=p.need,pts:TIER_PTS[b.t]};
  });
}
const badgeXP=()=>badgeState().filter(b=>b.got).reduce((s,b)=>s+b.pts,0);
const totalXP=()=>workXP()+badgeXP()+missionXP();

function levelFromXP(xp){
  let lv=1, floor=0, need=200;
  while(xp>=floor+need){ floor+=need; lv++; need=200+(lv-1)*60; }
  return {lv,floor,need,into:xp-floor};
}
function xpAtLevel(target){
  let lv=1, floor=0, need=200;
  while(lv<target){ floor+=need; lv++; need=200+(lv-1)*60; }
  return floor;
}
const RANKS=[[1,'Getting started'],[3,'Showing up'],[5,'Consistent'],[8,'Disciplined'],
             [12,'Hardened'],[16,'Relentless'],[21,'Formidable'],[26,'Unbothered']];
const rankFor=lv=>RANKS.filter(r=>lv>=r[0]).slice(-1)[0][1];

function streak(){
  let n=0, d=todayStr();
  if(!(setOn(d)==='rest'||setDone(d))) d=addDays(d,-1);
  while(setOn(d)==='rest'||setDone(d)){ n++; d=addDays(d,-1); }
  return n;
}
const sessions=()=>Object.keys(state.logs).filter(d=>setDone(d)).length;
const weekSets=mon=>daysOfWeekFrom(mon).filter(d=>setDone(d)).length;
function bestWeek(){
  const mons=[...new Set(Object.keys(state.logs).map(mondayOf))];
  return mons.length?Math.max(...mons.map(weekSets)):0;
}
function bestStreak(){
  const ds=[...new Set(Object.keys(state.logs).concat(Object.keys(state.plan)))].sort();
  let best=0,run=0,prev=null;
  ds.forEach(d=>{
    const ok=setOn(d)==='rest'||setDone(d);
    if(!ok){run=0;prev=d;return;}
    run = (prev && addDays(prev,1)===d) ? run+1 : 1;
    best=Math.max(best,run); prev=d;
  });
  return best;
}
function monthSets(){
  const m={};
  Object.keys(state.logs).forEach(d=>{ if(setDone(d)) m[d.slice(0,7)]=(m[d.slice(0,7)]||0)+1; });
  return Math.max(0,...Object.values(m),0);
}
function comeback(){
  const ds=Object.keys(state.logs).sort();
  for(let i=1;i<ds.length;i++){
    if((parse(ds[i])-parse(ds[i-1]))/86400000>=7) return 1;
  }
  return 0;
}
function overachieverDays(){
  return Object.keys(state.logs).filter(d=>{
    const l=exOf(d); return l.length&&l.every(k=>got(k,d)>=state.cfg.per[k]*1.5);
  }).length;
}

/* ================= badges ================= */
const B=(n,d,t,f)=>({n,d,t,f});
const BADGES=[
  B('First one down','Complete a single set',1,()=>({have:sessions(),need:1})),
  B('Five in the bank','Complete 5 sets',1,()=>({have:sessions(),need:5})),
  B('Ten deep','Complete 10 sets',2,()=>({have:sessions(),need:10})),
  B('Twenty five','Complete 25 sets',2,()=>({have:sessions(),need:25})),
  B('Half century','Complete 50 sets',3,()=>({have:sessions(),need:50})),
  B('Century','Complete 100 sets',3,()=>({have:sessions(),need:100})),

  B('Three in a row','A streak of 3 days',1,()=>({have:bestStreak(),need:3})),
  B('Seven day run','A streak of 7 days',2,()=>({have:bestStreak(),need:7})),
  B('Fortnight','A streak of 14 days',3,()=>({have:bestStreak(),need:14})),
  B('Thirty straight','A streak of 30 days',3,()=>({have:bestStreak(),need:30})),

  B('Ten thousand steps','10,000 steps walked',1,()=>({have:totalAll('steps'),need:10000})),
  B('Fifty thousand','50,000 steps walked',2,()=>({have:totalAll('steps'),need:50000})),
  B('Six figures','100,000 steps walked',2,()=>({have:totalAll('steps'),need:100000})),
  B('Quarter million','250,000 steps walked',3,()=>({have:totalAll('steps'),need:250000})),
  B('Half a million','500,000 steps walked',3,()=>({have:totalAll('steps'),need:500000})),

  B('First thousand','1,000 total reps and seconds',1,()=>({have:allRepTotal(),need:1000})),
  B('Five thousand','5,000 total reps and seconds',2,()=>({have:allRepTotal(),need:5000})),
  B('Twenty five thousand','25,000 total reps and seconds',3,()=>({have:allRepTotal(),need:25000})),

  B('Iron middle','5,000 seconds of plank',2,()=>({have:totalAll('plank'),need:5000})),
  B('Sideways','2,000 russian twists',2,()=>({have:totalAll('twists'),need:2000})),
  B('Lower deck','1,000 leg tuck ins',1,()=>({have:totalAll('tucks'),need:1000})),
  B('Engine room','5,000 jumping jacks',2,()=>({have:totalAll('jacks'),need:5000})),

  B('All rounder','Log all seven exercises',1,()=>({have:Object.keys(EX).filter(k=>totalAll(k)>0).length,need:7})),
  B('Perfect week','5 completed sets in one week',2,()=>({have:bestWeek(),need:5})),
  B('Big month','15 completed sets in a month',3,()=>({have:monthSets(),need:15})),
  B('Back at it','Return after a week away',2,()=>({have:comeback(),need:1})),
  B('Overshot','Beat every target by half in one session',2,()=>({have:overachieverDays(),need:1})),
  B('Planner','Plan 30 days ahead of time',1,()=>({have:Object.keys(state.plan).length,need:30})),

  B('Clean week','7 sugar-free days in a row',2,()=>({have:bestSugarStreak(),need:7})),
  B('Clean fortnight','14 sugar-free days in a row',3,()=>({have:bestSugarStreak(),need:14})),
  B('Clean month','30 sugar-free days in a row',3,()=>({have:bestSugarStreak(),need:30})),
  B('Off the soda','25 sugar-free days total',2,()=>({have:cleanDaysTotal(),need:25})),
  B('First clean day','A single sugar-free day',1,()=>({have:cleanDaysTotal(),need:1})),
  B('Ten fasts','Reach 12h+ on 10 days',1,()=>({have:Object.keys(state.logs).filter(d=>fastHours(d)>=state.cfg.fastFloor).length,need:10})),
  B('Full sixteen','Hit a full 16-hour fast',2,()=>({have:Object.keys(state.logs).some(d=>fastHours(d)>=state.cfg.fastFull)?1:0,need:1})),
  B('Hydrated','Hit your water goal on 20 days',2,()=>({have:Object.keys(state.logs).filter(d=>water(d)>=state.cfg.waterGoal).length,need:20}))
];

/* ================= diet ================= */
const water=d=>Number((state.logs[d]||{}).water)||0;

// ---- fast: you type the time you stopped eating the night before (stopHHMM, e.g. '22:00').
//      The fast runs from then to your break time (breakHour, default 14:00) and counts for
//      the day you break it. Stop at 22:00 -> break 14:00 = 16h. Stop at midnight = 14h. ----
const breakHour=()=>state.cfg.breakHour;   // hour of day (0-23) you break the fast, e.g. 14
function fastHours(d){
  const l=state.logs[d]||{};
  if(!l.stopHHMM) return 0;
  const m=/^(\d{1,2}):(\d{2})$/.exec(l.stopHHMM); if(!m) return 0;
  const stopMin=Number(m[1])*60+Number(m[2]);
  const breakMin=breakHour()*60;
  // stop time is the evening before the break. hours = from stop, forward across midnight, to break.
  let mins=(24*60 - stopMin) + breakMin;      // e.g. (1440-1320)+840 = 960 = 16h for 22:00 -> 14:00
  if(stopMin<=breakMin) mins = breakMin - stopMin;  // safety: same-day stop before break
  return Math.max(0, mins/60);
}
function fastTier(h){
  const f=state.cfg;
  if(h>=f.fastFull) return {k:3,label:'Full 16:8',note:'Best tier'};
  if(h>=f.fastGood) return {k:2,label:'Strong fast',note:''};
  if(h>=f.fastFloor) return {k:1,label:'Solid fast',note:''};
  if(h>0) return {k:0,label:'Short fast',note:''};
  return {k:-1,label:'Not logged',note:''};
}
const fastKept=d=>fastHours(d)>=state.cfg.fastFloor;

// ---- sugar: each day stores sugarTicks (which of the 4 items were beaten) + an optional
//      override 'cheat' | 'slip'. All four ticked = a clean day that builds the streak. ----
const sugarTicks=d=>(state.logs[d]||{}).sugarTicks||[];
const sugarOverride=d=>(state.logs[d]||{}).sugar;   // 'cheat' | 'slip' | undefined
const NSUGAR=()=>state.cfg.sugarList.length;
// derived day state used by the streak
function sugarState(d){
  const o=sugarOverride(d);
  if(o==='cheat'||o==='slip') return o;
  const t=sugarTicks(d).length;
  if(t>=NSUGAR()) return 'clean';        // full sweep
  if(t>0) return 'partial';              // some wins, streak waits
  return undefined;                      // nothing logged
}
function sugarStreak(){
  // walk back from today; clean adds, cheat pauses, partial/slip/gap stops.
  let run=0, d=todayStr();
  const st0=sugarState(d);
  if(st0===undefined||st0==='partial') d=addDays(d,-1);   // an unfinished today doesn't break yesterday's run
  while(true){
    const st=sugarState(d);
    if(st==='clean'){ run++; d=addDays(d,-1); }
    else if(st==='cheat'){ d=addDays(d,-1); }   // planned pause: neither adds nor breaks
    else break;                                  // partial, slip, or gap ends the run
  }
  return run;
}
function bestSugarStreak(){
  const ds=Object.keys(state.logs).filter(d=>sugarState(d)).sort();
  let best=0,run=0,prev=null;
  ds.forEach(d=>{
    const st=sugarState(d), consec=prev&&addDays(prev,1)===d;
    if(st==='clean'){ run=consec?run+1:1; }
    else if(st==='cheat'){ run=consec?run:0; }
    else { run=0; }
    best=Math.max(best,run); prev=d;
  });
  return Math.max(best,sugarStreak());
}
const cleanDaysTotal=()=>Object.keys(state.logs).filter(d=>sugarState(d)==='clean').length;
const cheatsThisMonth=()=>{const m=todayStr().slice(0,7);
  return Object.keys(state.logs).filter(d=>d.slice(0,7)===m&&sugarState(d)==='cheat').length;};

/* ================= daily missions ================= */
// built from what you chose for that day, so they never ask for a set you did not pick
function missionsFor(d){
  const sel=setOn(d), goal=state.cfg.stepGoal, steps=got('steps',d);
  const stepMission={n:'Walk '+goal.toLocaleString()+' steps', pts:25,
    have:Math.min(steps,goal), need:goal};

  const fastM={n:'Fast 12 hours or more', pts:20, have:Math.min(Math.floor(fastHours(d)),state.cfg.fastFloor), need:state.cfg.fastFloor};
  const sugarM={n:'Beat all '+NSUGAR()+' sugar sources', pts:20, have:sugarOverride(d)?0:sugarTicks(d).length, need:NSUGAR()};
  const waterM={n:'Drink '+state.cfg.waterGoal+' glasses of water', pts:15, have:Math.min(water(d),state.cfg.waterGoal), need:state.cfg.waterGoal};
  if(!sel){
    return [
      {n:'Choose today: Juu, Chini or Rest', pts:10, have:0, need:1},
      stepMission, fastM, sugarM, waterM
    ];
  }
  if(sel==='rest'){
    return [
      stepMission, fastM, sugarM, waterM,
      {n:'Rest day taken', pts:10, have:1, need:1}
    ];
  }
  const list=exOf(d);
  const atTarget=list.filter(k=>got(k,d)>=state.cfg.per[k]).length;
  const started=list.filter(k=>got(k,d)>0).length;
  return [
    {n:'Start the '+setName(d)+' set', pts:10, have:Math.min(started,1), need:1},
    {n:'Finish all '+list.length+' exercises', pts:40, have:atTarget, need:list.length},
    stepMission,
    fastM, sugarM, waterM
  ];
}
function missionXP(){
  const days=[...new Set(Object.keys(state.logs).concat(Object.keys(state.plan)))]
    .filter(d=>d<=todayStr());
  return days.reduce((s,d)=>s+missionsFor(d).filter(m=>m.have>=m.need).reduce((a,m)=>a+m.pts,0),0);
}

/* ================= storage ================= */
async function load(){
  try{
    const raw=await store.get(KEY) || await store.get('fatu-tracker-v2');
    if(raw){const s=JSON.parse(raw);
      state.logs=s.logs||{}; state.plan=s.plan||{}; state.seen=s.seen||[];
      state.cfg=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)),s.cfg||{});
      state.cfg.year=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG.year)),state.cfg.year||{});
      if(!state.cfg.nameTouched){state.cfg.sets.A.name=DEFAULT_CFG.sets.A.name;state.cfg.sets.B.name=DEFAULT_CFG.sets.B.name;}
      if(state.cfg.waterGoal===8&&!state.cfg.waterTouched) state.cfg.waterGoal=4;
    }
  }catch(e){}
  viewDay=todayStr();
  render();
  checkNewBadges(true);
}
async function save(){ await store.set(KEY,JSON.stringify(state)); }
async function logValue(id,val){
  const v=Math.max(0,Math.round(Number(val)||0));
  state.logs[viewDay]=state.logs[viewDay]||{};
  if(v>0) state.logs[viewDay][id]=v; else delete state.logs[viewDay][id];
  if(!Object.keys(state.logs[viewDay]).length) delete state.logs[viewDay];
  await save(); render(); checkNewBadges();
}

async function checkNewBadges(silent){

  const t=e.target.closest&&e.target.closest('[data-day],[data-pick],[data-opentoday],[data-openday],[data-today],[data-dayshift]');
  if(!t) return;
  if(t.hasAttribute('data-day')){
    if(page==='home') openDayModal(t.dataset.day);
    else { viewDay=t.dataset.day; render(); }
  } else if(t.hasAttribute('data-opentoday')){

    if(dir>0 && viewDay>=addDays(todayStr(),MAXAHEAD)) return;
    viewDay=addDays(viewDay,dir); render();

    <div class="tile"><b>${gotN}/${BADGES.length}</b><span>badges earned</span></div>
    <div class="tile"><b>${bestStreak()}</b><span>longest streak</span></div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="cap">Today's missions</div>
    ${ms.map(m=>{const done=m.have>=m.need;return `<div class="mission ${done?'done':''}">
      <div class="mt"><b>${done?'&#10003; ':''}${m.n}</b><span>+${m.pts}</span></div>
      <div class="tbar"><i style="width:${m.have/m.need*100}%"></i></div>
      <div class="pcts"><span>${m.have} of ${m.need}</span><span>${done?'claimed':'in progress'}</span></div>
    </div>`;}).join('')}
  </div>

  <div class="card">
    <div class="cap">Targets for 2026</div>
    <p class="lede" style="margin-bottom:6px">The grey line is where an even pace would put you today.</p>
    ${rows.map(([k,name,unit])=>{
      const total=sumIn(k,yearFrom,'9999'), target=state.cfg.year[k]||1;
      const pct=Math.min(100,total/target*100), on=pct>=elapsed*100;
      return `<div class="trow">
        <div class="top"><b>${name}</b><span><em>${total.toLocaleString()}</em> of ${target.toLocaleString()} ${unit}</span></div>
        <div class="tbar"><i class="${on?'':'slow'}" style="width:${pct}%"></i><u style="left:${elapsed*100}%"></u></div>
        <div class="pcts"><span>${pct.toFixed(1)}% of target</span><span>${on?'ahead of pace':'behind pace'}</span></div>
      </div>`;}).join('')}
    <div class="ghostrow"><button class="ghost" data-yeargoal="1">Change yearly targets</button></div>
  </div>

  <div class="card">
    <div class="cap">Levels and ranks</div>
    <p class="lede" style="margin-bottom:8px">Every level costs 60 points more than the one before it.</p>
    ${RANKS.map((r,i)=>{
      const lv=r[0], name=r[1], cost=xpAtLevel(lv);
      const nextLv=RANKS[i+1]?RANKS[i+1][0]:null;
      const reached=L.lv>=lv;
      const here=reached&&(!nextLv||L.lv<nextLv);
      return `<div class="lad ${reached?'reached':''} ${here?'here':''}">
        <div class="num">${lv}</div>
        <div class="txt"><b>${name}</b><span>${cost===0?'from the start':cost.toLocaleString()+' points'}</span></div>
        <div class="st">${here?'you are here':(reached?'passed':(cost-xp).toLocaleString()+' to go')}</div>
      </div>`;}).join('')}
  </div>

  <div class="card">
    <div class="cap">How points are earned</div>
    <table class="ptab"><tbody>
      <tr><td>An exercise at its target</td><td>12</td></tr>
      <tr><td>An exercise beaten by half</td><td>18</td></tr>
      <tr><td>An exercise part done</td><td>5</td></tr>
      <tr><td>Clearing a whole set</td><td>15</td></tr>
      <tr><td>Steps, per 500 walked</td><td>2</td></tr>
      <tr><td>A rest day you chose</td><td>4</td></tr>
      <tr><td>A fast of 12 hours or more</td><td>15</td></tr>
      <tr><td>Each sugar source beaten</td><td>5</td></tr>
      <tr><td>All four beaten (clean day)</td><td>+10</td></tr>
      <tr><td>Water, per glass</td><td>2</td></tr>
      <tr><td>A badge, by tier</td><td>50 &middot; 120 &middot; 250</td></tr>
      <tr><td>A weekly mission</td><td>60 to 170</td></tr>
    </tbody></table>
    <p class="metaline">A full Chini session with 2,000 steps is about 71 points.</p>
  </div>

  <div class="card">
    <div class="cap">Your data</div>
    <p class="lede" style="margin-top:0">Everything lives on this phone. Back it up to a file you keep, and load it onto a new phone or after clearing your browser. Do this now and then.</p>
    <div class="ghostrow">
      <button class="ghost" data-export="1">Back up to a file</button>
      <button class="ghost" data-import="1">Restore from a file</button>
    </div>
  </div>

  <div class="card">
    <div class="cap">Badges &middot; ${gotN} of ${BADGES.length}</div>
    <div class="badges">
      ${bs.map(b=>`<div class="badge t${b.t} ${b.got?'got':''}">
        <span class="mark">${b.got?'&#10003;':'&#9679;'}</span>
        <b>${b.n}</b><span class="sub">${b.d}</span>
        ${b.got?`<span class="pts">+${b.pts} points</span>`
               :`<div class="mini"><i style="width:${b.have/b.need*100}%"></i></div>
                 <span class="pts">${b.have.toLocaleString()} of ${b.need.toLocaleString()}</span>`}
      </div>`).join('')}
    </div>
  </div>`;
}

/* ================= shareable progress card ================= */
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function makeShareCard(){
  const W=1080, H=1350, s=3;
  const c=document.createElement('canvas'); c.width=W*s; c.height=H*s;
  const x=c.getContext('2d'); x.scale(s,s); x.textBaseline='alphabetic';

  const xp=totalXP(), L=levelFromXP(xp);
  const done=sessions(), st=streak(), sug=bestSugarStreak();
  const steps=totalAll('steps'), gotB=badgeState().filter(b=>b.got).length;
  const all=Object.keys(state.logs).sort();
  const started=all[0]||todayStr();
  const daysIn=Math.round((parse(todayStr())-parse(started))/86400000)+1;

  const F=(w,sz)=>`${w} ${sz}px Nunito, system-ui, sans-serif`;
  const RF=sz=>`400 ${sz}px "Varela Round", Nunito, sans-serif`;
  const INK='#004D1E', GO='#009C41', MUT='#5C7A68', LINE='#E1EDE6';

  // ---------- white base ----------
  x.fillStyle='#FFFFFF'; x.fillRect(0,0,W,H);

  // ---------- green top panel ----------
  const GT=560;
  const g=x.createLinearGradient(0,0,W,GT);
  g.addColorStop(0,'#02671F'); g.addColorStop(1,'#00390F');
  x.fillStyle=g; x.fillRect(0,0,W,GT);
  x.fillStyle='rgba(255,255,255,.06)';
  x.beginPath(); x.arc(W-60,120,220,0,7); x.fill();

  x.textAlign='left';
  x.fillStyle='#9BEDBC'; x.font=F(900,30); x.letterSpacing='8px';
  x.fillText("FATU\u2019S HEALTH TRACKER", 72, 120);
  x.letterSpacing='0px';
  x.fillStyle='#FFFFFF'; x.font=RF(84);
  x.fillText(rankFor(L.lv), 70, 208);
  x.fillStyle='#BFE9CE'; x.font=F(800,32);
  x.fillText(`Level ${L.lv}`, 74, 258);

  // hero points, inside the green
  x.fillStyle='#FFFFFF'; x.font=RF(210);
  x.fillText(xp.toLocaleString(), 64, 470);
  x.fillStyle='#9BEDBC'; x.font=F(900,40); x.letterSpacing='3px';
  x.fillText('POINTS EARNED', 74, 524);
  x.letterSpacing='0px';

  // ---------- white stat zone ----------
  const stats=[
    [done, 'sets completed'],
    [st, 'day streak'],
    [sug, 'best no-sugar run'],
    [steps.toLocaleString(), 'steps walked'],
    [gotB, 'badges earned'],
    [L.lv, 'level reached']
  ];
  const gx=64, gap=26, gw=(W-gx*2-gap)/2, gh=150;
  const gyTop=GT+46;
  stats.forEach((stat,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const bx=gx+col*(gw+gap), by=gyTop+row*(gh+gap);
    x.fillStyle='#F5FAF7'; roundRect(x,bx,by,gw,gh,24); x.fill();
    x.strokeStyle=LINE; x.lineWidth=2; roundRect(x,bx,by,gw,gh,24); x.stroke();
    x.fillStyle=INK; x.font=RF(60);
    x.fillText(String(stat[0]), bx+28, by+80);
    x.fillStyle=MUT; x.font=F(900,24); x.letterSpacing='1.5px';
    x.fillText(String(stat[1]).toUpperCase(), bx+30, by+118);
    x.letterSpacing='0px';
  });

  // ---------- footer: PINNED to the bottom of the card ----------
  // The footer no longer follows the grid. It rests at the base, a fixed
  // distance from the bottom edge, the way a real footer does.
  const dateY = H - 92;          // upper footer line (the date)
  const subY  = H - 56;          // lower footer line (day + start)
  const ruleY = H - 150;         // hairline above the footer band
  x.strokeStyle=LINE; x.lineWidth=2;
  x.beginPath(); x.moveTo(72,ruleY); x.lineTo(W-72,ruleY); x.stroke();

  // left: date over its sub-line
  x.textAlign='left';
  x.fillStyle=INK; x.font=F(800,33);
  x.fillText(longDate(todayStr()), 72, dateY);
  x.fillStyle=MUT; x.font=F(700,26);
  x.fillText(`Day ${daysIn} \u00b7 started ${longDate(started)}`, 72, subY);

  // right: tagline, centred between the two footer lines
  x.textAlign='right';
  x.fillStyle=GO; x.font=F(800,29);
  x.fillText('history in the making', W-72, (dateY+subY)/2 + 4);
  x.textAlign='left';

  c.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='fatu-progress-'+todayStr()+'.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Card saved','High-res image in your downloads. Save it to your photos to keep it.');
  },'image/png');
}

/* ================= render ================= */
function render(){
  renderChrome();
  const map={home:homePage,body:bodyPage,core:corePage,diet:dietPage,prog:progPage};
  ['home','body','core','diet','prog'].forEach(p=>{
    const el=document.getElementById('p-'+p);
    el.innerHTML = page===p?map[p]():'';
    el.hidden = page!==p;
  });
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.go===page));
  wire();
}
function wire(){
  document.querySelectorAll('[data-log]').forEach(i=>{
    i.onchange=()=>logValue(i.dataset.log,i.value);
    i.onkeydown=e=>{if(e.key==='Enter') i.blur();};
  });
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    page=b.dataset.go; window.scrollTo({top:0,behavior:'smooth'}); render();});
  document.querySelectorAll('[data-plan]').forEach(b=>
    b.onclick=()=>planDay(viewDay,b.dataset.plan,!!b.parentElement.dataset.jump));
  const f=document.querySelector('[data-fillall]');
  if(f) f.onclick=async()=>{
    state.logs[viewDay]=state.logs[viewDay]||{};
    exOf(viewDay).forEach(k=>{ if(!got(k,viewDay)) state.logs[viewDay][k]=state.cfg.per[k]; });
    await save(); render(); checkNewBadges();};
  const cd=document.querySelector('[data-clearday]');
  if(cd) cd.onclick=async()=>{
    if(!confirm('Clear every number logged for '+longDate(viewDay)+'?')) return;
    exOf(viewDay).forEach(k=>{ if(state.logs[viewDay]) delete state.logs[viewDay][k]; });
    if(state.logs[viewDay]&&!Object.keys(state.logs[viewDay]).length) delete state.logs[viewDay];
    await save(); render();};
  const cs=document.querySelector('[data-clearsteps]');
  if(cs) cs.onclick=async()=>{
    if(state.logs[viewDay]) delete state.logs[viewDay].steps;
    if(state.logs[viewDay]&&!Object.keys(state.logs[viewDay]).length) delete state.logs[viewDay];
    await save(); render();};
  // ---- fast: one input, the stop time. break time is fixed (default 2pm). ----
  const ensure=()=>{state.logs[viewDay]=state.logs[viewDay]||{};return state.logs[viewDay];};
  const tidy=()=>{if(state.logs[viewDay]&&!Object.keys(state.logs[viewDay]).length) delete state.logs[viewDay];};
  const ss=document.querySelector('[data-setstop]');
  if(ss) ss.onclick=async()=>{
    const cur=(state.logs[viewDay]||{}).stopHHMM||'22:00';
    const v=prompt('What time did you stop eating last night? 24-hour time, e.g. 22:00 for 10pm.',cur);
    if(v===null) return;
    const m=/^(\d{1,2}):(\d{2})$/.exec(v.trim());
    if(!m||Number(m[1])>23||Number(m[2])>59){alert('Enter it like 22:00.');return;}
    ensure().stopHHMM=(m[1].padStart(2,'0'))+':'+m[2];
    await save(); render(); checkNewBadges();
    const t=fastTier(fastHours(viewDay));
    if(t.k>=1) toast(t.label+'!', Math.round(fastHours(viewDay))+' hours since your last meal. Well held.');};
  const bhr=document.querySelector('[data-breakhour]');
  if(bhr) bhr.onclick=async()=>{
    const v=prompt('What time do you usually break the fast? 24-hour, e.g. 14 for 2pm.',state.cfg.breakHour);
    const n=Number(v);
    if(v!==null && n>=0 && n<=23){ state.cfg.breakHour=Math.round(n); await save(); render(); }};
  const cf=document.querySelector('[data-clearfast]');
  if(cf) cf.onclick=async()=>{
    if(state.logs[viewDay]) delete state.logs[viewDay].stopHHMM;
    tidy(); await save(); render();};

  // tap a single win: toggle that item; clears any cheat/slip override
  document.querySelectorAll('[data-tick]').forEach(b=>b.onclick=async()=>{
    const i=Number(b.dataset.tick);
    const l=ensure();
    delete l.sugar;                       // ticking a win means the day isn't a cheat/slip
    const set=new Set(l.sugarTicks||[]);
    const wasFull=set.size>=NSUGAR();
    if(set.has(i)) set.delete(i); else set.add(i);
    l.sugarTicks=[...set].sort((a,b)=>a-b);
    if(!l.sugarTicks.length) delete l.sugarTicks;
    tidy(); await save(); render(); checkNewBadges();
    if(!wasFull && set.size>=NSUGAR()) toast('Clean day!','All four beaten. Streak climbs. +'+(NSUGAR()*5+10)+' points.');});
  // cheat / slip override: replaces the ticks for the day
  document.querySelectorAll('[data-sugar]').forEach(b=>b.onclick=async()=>{
    const l=ensure();
    const v=b.dataset.sugar;
    if(l.sugar===v){ delete l.sugar; }
    else { l.sugar=v; delete l.sugarTicks; }
    tidy(); await save(); render(); checkNewBadges();});
  document.querySelectorAll('[data-water]').forEach(b=>b.onclick=async()=>{
    const n=Number(b.dataset.water);
    state.logs[viewDay]=state.logs[viewDay]||{};
    state.logs[viewDay].water = (water(viewDay)===n)?n-1:n;
    if(!state.logs[viewDay].water) delete state.logs[viewDay].water;
    if(!Object.keys(state.logs[viewDay]).length) delete state.logs[viewDay];
    await save(); render(); checkNewBadges();});
  const wl=document.querySelector('[data-waterless]');
  if(wl) wl.onclick=async()=>{
    if(water(viewDay)>0){state.logs[viewDay].water--;
      if(!state.logs[viewDay].water) delete state.logs[viewDay].water;
      if(!Object.keys(state.logs[viewDay]).length) delete state.logs[viewDay];
      await save(); render();}};
  const wg=document.querySelector('[data-watergoal]');
  if(wg) wg.onclick=async()=>{
    const v=prompt('Glasses of water a day:',state.cfg.waterGoal);
    if(v&&Number(v)>0){state.cfg.waterGoal=Math.round(Number(v)); state.cfg.waterTouched=true; await save(); render();}};
  const rd=document.querySelector('[data-restdays]');
  if(rd) rd.onclick=async()=>{
    const v=prompt('How many rest days are you aiming for each week?',state.cfg.restTarget);
    const n=Math.round(Number(v));
    if(n>=0&&n<=7){state.cfg.restTarget=n; await save(); render();}
    else if(v!==null) alert('Pick a number between 0 and 7.');};
  const eg=document.querySelector('[data-editgoal]');
  if(eg) eg.onclick=async()=>{
    const v=prompt('Steps per day:',state.cfg.stepGoal);
    if(v&&Number(v)>0){state.cfg.stepGoal=Math.round(Number(v)); await save(); render();}};
  const rn=document.querySelector('[data-rename]');
  if(rn) rn.onclick=async()=>{
    const a=prompt('Name for the three standing exercises:',state.cfg.sets.A.name);
    if(a) state.cfg.sets.A.name=a.trim();
    const b=prompt('Name for the four ground exercises:',state.cfg.sets.B.name);
    if(b) state.cfg.sets.B.name=b.trim();
    state.cfg.nameTouched=true; await save(); render();};
  const rt=document.querySelector('[data-retarget]');
  if(rt) rt.onclick=async()=>{
    for(const k of Object.keys(EX)){
      const v=prompt(EX[k].name+' per session ('+EX[k].unit+'):',state.cfg.per[k]);
      if(v===null) break;
      if(Number(v)>0) state.cfg.per[k]=Math.round(Number(v));}
    await save(); render();};
  const sc=document.querySelector('[data-sharecard]');
  if(sc) sc.onclick=()=>makeShareCard();

  const ex=document.querySelector('[data-export]');
  if(ex) ex.onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='fatu-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Backed up','Keep this file safe. Load it any time to restore.');};
  const im=document.querySelector('[data-import]');
  if(im) im.onclick=()=>{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='application/json,.json';
    inp.onchange=()=>{
      const file=inp.files[0]; if(!file) return;
      const r=new FileReader();
      r.onload=async()=>{
        try{
          const data=JSON.parse(r.result);
          if(!data||typeof data!=='object'||!('logs' in data)) throw 0;
          if(!confirm('This replaces everything currently in the app with the backup. Continue?')) return;
          state.logs=data.logs||{}; state.plan=data.plan||{}; state.seen=data.seen||[];
          state.cfg=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)),data.cfg||{});
          state.cfg.year=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG.year)),data.cfg&&data.cfg.year||{});
          await save(); viewDay=todayStr(); page='home'; render();
          toast('Restored','Your history is back.');
        }catch(e){ alert('That file could not be read. Make sure it is a backup this app created.'); }
      };
      r.readAsText(file);
    };
    inp.click();};
  const yg=document.querySelector('[data-yeargoal]');
  if(yg) yg.onclick=async()=>{
    const list=[['steps','Steps','steps'],...Object.entries(EX).map(([k,v])=>[k,v.name,v.unit])];
    for(const [k,name,unit] of list){
      const v=prompt(name+' total for 2026 ('+unit+'):',state.cfg.year[k]);
      if(v===null) break;
      if(Number(v)>0) state.cfg.year[k]=Math.round(Number(v));}
    await save(); render();};
}


document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{
  page=b.dataset.go; window.scrollTo({top:0,behavior:'smooth'}); render();});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

load();
</script>
